<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roampage</title>
<script>
  // GitHub Pages SPA redirect trick.
  // Redirects any unknown sub-path back to the root of the docs site
  // so the app's JavaScript can handle routing client-side.
  var base = location.pathname.split('/').slice(0, 2).join('/');
  sessionStorage.setItem('spa-redirect', location.pathname + location.search + location.hash);
  location.replace(base + '/');
</script>
</head>
<body></body>
</html>
