<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1219">
<title>Roampage</title>
<link rel="icon" type="image/png" href="/favicon.png?v=4">
<link rel="apple-touch-icon" href="/favicon.png?v=4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="/pell.min.css" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0f1219;color:#e2e8f0;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.95) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.shell{min-height:100vh;background:linear-gradient(180deg,#0f1219 0%,#131825 50%,#0f1219 100%);position:relative}
.container{max-width:960px;margin:0 auto;padding:32px 24px 60px}
@media(max-width:700px){.container{padding:20px 16px 40px}}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:12px}
.header-left{display:flex;align-items:center;gap:12px}
.header-logo{height:40px;width:auto}
@media(max-width:700px){.header-logo{height:32px}}
.header h1{font-size:26px;font-weight:800;letter-spacing:1px;color:#fff}
@media(max-width:700px){.header h1{font-size:20px}}
.btn-config{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:8px 16px;color:#94a3b8;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;font-family:inherit;white-space:nowrap}
.btn-config.active{background:rgba(139,92,246,.25);border-color:rgba(139,92,246,.4);color:#c4b5fd}

/* Search input */
.search-input{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:6px 10px;color:#e2e8f0;font-size:13px;outline:none;font-family:inherit;width:200px;margin-left:12px}
.search-input:focus{border-color:rgba(139,92,246,.5)}
@media(max-width:700px){.search-input{display:none}}

/* Page tabs */
.page-tabs{display:flex;align-items:center;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.page-tab{padding:5px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#94a3b8;font-family:inherit;transition:all .15s}
.page-tab.active{background:rgba(139,92,246,.2);border-color:rgba(139,92,246,.4);color:#c4b5fd}
.page-tab-add{padding:5px 10px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;border:1px dashed rgba(139,92,246,.4);background:rgba(139,92,246,.08);color:#a78bfa;font-family:inherit}
.page-tab-del{font-size:10px;margin-left:4px;opacity:.5;cursor:pointer}
.page-tab-del:hover{opacity:1;color:#ef4444}

.btn-col{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:5px 12px;color:#94a3b8;font-size:12px;font-weight:600;cursor:pointer;margin-bottom:16px;font-family:inherit}
.grid{display:grid;gap:0 32px;align-items:start}
.grid.cols-2{grid-template-columns:1fr 1fr}.grid.cols-1{grid-template-columns:1fr}
@media(max-width:700px){.grid.cols-2{grid-template-columns:1fr}}

.cat-title{font-size:13px;font-weight:600;color:#64748b;letter-spacing:1.5px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.06);margin-bottom:4px}
.category{margin-bottom:24px}

.svc-row{display:flex;align-items:center;gap:12px;padding:10px 4px;text-decoration:none;color:inherit;border-radius:8px;transition:background .15s;cursor:pointer;user-select:none;-webkit-user-select:none}
.svc-row:hover{background:rgba(255,255,255,.03)}.svc-row:active{opacity:.7}
.svc-icon{width:40px;height:40px;border-radius:10px;flex-shrink:0;background:rgba(255,255,255,.05);padding:4px;object-fit:contain}
.svc-info{flex:1;min-width:0}
.svc-name-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.svc-name{font-weight:700;font-size:13px;color:#e2e8f0;text-transform:uppercase;letter-spacing:.5px}
.svc-desc{font-size:11px;color:#64748b;margin-top:2px;text-transform:uppercase;letter-spacing:.3px}

.tag{font-size:9px;font-weight:700;padding:2px 8px;border-radius:4px;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap;color:#fff}
.multi-badge{font-size:9px;background:rgba(139,92,246,.2);color:#a78bfa;padding:1px 6px;border-radius:4px;font-weight:700}

.status{display:flex;align-items:center;gap:4px;flex-shrink:0}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.status-dot.up{background:#22c55e;box-shadow:0 0 6px rgba(34,197,94,.38)}
.status-dot.down{background:#ef4444;box-shadow:0 0 6px rgba(239,68,68,.38)}
.status-dot.checking{background:#f59e0b;animation:pulse 1.5s infinite}
.status-label{font-size:11px;font-weight:600}
.status-label.up{color:#22c55e}
.status-label.down{color:#ef4444}.status-label.checking{color:#f59e0b}

/* Popup */
.overlay{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);animation:fadeIn .15s ease}
.popup{background:#1e2030;border-radius:16px;padding:20px;min-width:260px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.08);animation:popIn .2s ease}
.popup-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.popup-icon{width:36px;height:36px;border-radius:8px}
.popup-title{font-weight:700;font-size:15px;color:#e2e8f0}
.popup-sub{font-size:11px;color:#94a3b8}
.popup-choice{display:flex;align-items:center;gap:10px;padding:12px 14px;background:rgba(255,255,255,.04);border-radius:10px;text-decoration:none;color:#e2e8f0;font-size:14px;font-weight:500;border:1px solid rgba(255,255,255,.06);cursor:pointer;transition:background .15s;margin-bottom:6px}
.popup-choice:hover{background:rgba(139,92,246,.15)}
.popup-num{width:28px;height:28px;border-radius:6px;background:rgba(139,92,246,.2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#a78bfa;flex-shrink:0}
.popup-status{margin-left:auto}

.hint{text-align:center;margin-top:24px;font-size:11px;color:#475569}.hint span{color:#a78bfa}
.empty-page{text-align:center;padding:80px 20px;color:#64748b;font-size:15px}
.empty-page strong{color:#a78bfa}

/* Edit */
.edit-section{margin-bottom:16px}
.edit-label{font-size:11px;color:#64748b;font-weight:600;margin-bottom:4px;display:block;text-transform:uppercase;letter-spacing:.5px}
.edit-input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:8px 10px;color:#e2e8f0;font-size:13px;outline:none;font-family:inherit}
.edit-input:focus{border-color:rgba(139,92,246,.5)}
.edit-input.title-input{font-weight:700;font-size:14px;letter-spacing:1px}
.edit-cat{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:16px;margin-bottom:16px}
.edit-cat-header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.edit-svc{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:12px;margin-bottom:8px;overflow:hidden}
.edit-svc-header{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer}
.edit-svc-icon{width:28px;height:28px;border-radius:6px;background:rgba(255,255,255,.05);object-fit:contain}
.edit-svc-name{flex:1;font-weight:600;font-size:13px;color:#e2e8f0}
.edit-svc-body{padding:0 12px 14px;display:flex;flex-direction:column;gap:10px}
.icon-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:#94a3b8;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:6px;transition:all .15s;font-family:inherit}
.icon-btn:hover{background:rgba(255,255,255,.12)}.icon-btn.danger{color:#ef4444}
.chevron{transition:transform .2s}.chevron.open{transform:rotate(180deg)}
.tag-toggle{padding:3px 10px;border-radius:6px;font-size:10px;font-weight:700;border:1px solid rgba(255,255,255,.15);cursor:pointer;text-transform:uppercase;transition:all .15s;color:#94a3b8;background:transparent;font-family:inherit}.tag-toggle.active{color:#fff}
.tag-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 8px 3px 10px;border-radius:6px;font-size:10px;font-weight:700;text-transform:uppercase;cursor:pointer;transition:all .15s;border:1px solid transparent}
.tag-pill .tag-x{font-size:12px;opacity:.6;cursor:pointer;margin-left:2px}.tag-pill .tag-x:hover{opacity:1}
.new-tag-input{width:80px;background:rgba(255,255,255,.06);border:1px dashed rgba(255,255,255,.2);border-radius:6px;padding:3px 8px;color:#e2e8f0;font-size:10px;font-weight:700;text-transform:uppercase;outline:none;font-family:inherit}.new-tag-input:focus{border-color:rgba(139,92,246,.5)}
.server-row{display:flex;gap:6px;margin-bottom:6px;align-items:center}.server-label-input{width:120px;flex-shrink:0}
.btn-add{border:1px dashed rgba(139,92,246,.4);border-radius:8px;padding:6px 12px;color:#a78bfa;font-size:12px;font-weight:600;cursor:pointer;width:100%;background:rgba(139,92,246,.12);font-family:inherit}
.btn-add-svc{border-radius:10px;padding:10px;font-size:13px;margin-top:4px}
.btn-add-cat{border-radius:12px;padding:14px;font-size:14px;font-weight:700;margin-bottom:8px}
.btn-small{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:6px 14px;color:#94a3b8;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-browse{background:rgba(139,92,246,.15);border:1px solid rgba(139,92,246,.3);border-radius:8px;padding:6px 12px;color:#a78bfa;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;transition:all .15s}.btn-browse:hover{background:rgba(139,92,246,.25)}
.json-modal{background:#1e2030;border-radius:16px;padding:20px;width:90vw;max-width:500px;max-height:80vh;display:flex;flex-direction:column;gap:12px;border:1px solid rgba(255,255,255,.08)}
.json-textarea{width:100%;height:300px;resize:vertical;font-family:monospace;font-size:11px}
.json-error{color:#ef4444;font-size:12px}.json-actions{display:flex;gap:8px;justify-content:flex-end}
.icon-browser-overlay{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);animation:fadeIn .15s ease}
.icon-browser{background:#1e2030;border-radius:16px;padding:20px;width:90vw;max-width:520px;max-height:80vh;display:flex;flex-direction:column;gap:12px;border:1px solid rgba(255,255,255,.08);animation:popIn .2s ease}
.icon-browser-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;overflow-y:auto;max-height:50vh;padding:4px}
.icon-browser-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:10px;cursor:pointer;transition:background .15s;border:2px solid transparent}
.icon-browser-item:hover{background:rgba(255,255,255,.06)}.icon-browser-item.selected{border-color:#8b5cf6;background:rgba(139,92,246,.12)}
.icon-browser-item img{width:36px;height:36px;border-radius:6px;object-fit:contain}
.icon-browser-item span{font-size:8px;color:#94a3b8;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%;display:block}
.icon-browser-empty,.icon-browser-loading{text-align:center;color:#64748b;font-size:13px;padding:40px 0}
.wallpaper-preview{width:100%;height:80px;border-radius:8px;object-fit:cover;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03)}
.wp-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.wp-row label{font-size:11px;color:#94a3b8;width:70px;flex-shrink:0;font-weight:600}
.wp-upload-btn{display:inline-flex;align-items:center;gap:4px;background:rgba(139,92,246,.15);border:1px solid rgba(139,92,246,.3);border-radius:8px;padding:6px 12px;color:#a78bfa;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}
.dragging{opacity:0.5}
.drop-target-before::before{content:"";display:block;height:2px;background:#8b5cf6;margin-bottom:8px}
.drop-target-after::after{content:"";display:block;height:2px;background:#8b5cf6;margin-top:8px}
/* Widgets */
.widget{border-radius:12px;padding:16px;margin:8px 0}
.widget-clock{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px}
.widget-clock .clock-time{font-size:48px;font-weight:800;color:#fff;letter-spacing:-1px;line-height:1}
.widget-clock .clock-seconds{font-size:20px;font-weight:400;color:#64748b;margin-left:4px}
.widget-clock .clock-date{font-size:13px;color:#94a3b8;margin-top:4px;font-weight:500;text-transform:uppercase;letter-spacing:1px}
.widget-text{color:#cbd5e1;font-size:13px;line-height:1.6;padding:0;margin:4px 0}
.widget-text a{color:#a78bfa;text-decoration:underline}
.widget-text h1,.widget-text h2,.widget-text h3{color:#e2e8f0;margin:8px 0 4px}
.widget-text ul,.widget-text ol{padding-left:20px;margin:4px 0}
.pell{border:1px solid rgba(255,255,255,.1);border-radius:8px;overflow:hidden;background:rgba(255,255,255,.03)}
.pell-actionbar{background:rgba(255,255,255,.05);border-bottom:1px solid rgba(255,255,255,.08);padding:4px}
.pell-button{color:#94a3b8;background:transparent;border:none;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:13px;font-weight:600}
.pell-button:hover{background:rgba(255,255,255,.1);color:#e2e8f0}
.pell-button-selected{background:rgba(139,92,246,.2);color:#a78bfa}
.pell-content{min-height:80px;padding:10px;color:#e2e8f0;font-size:13px;outline:none;font-family:inherit;line-height:1.6}
.pell-content:focus{outline:none}
.pell-home-wrap .pell-actionbar{opacity:0;max-height:0;overflow:hidden;padding:0;border:none;transition:all .2s ease}
.pell-home-wrap .pell-content{min-height:0!important;height:auto!important;max-height:320px;overflow-y:auto;padding:6px 10px!important}
.pell-home-wrap:focus-within .pell-actionbar{opacity:1;max-height:40px;padding:4px;border-bottom:1px solid rgba(255,255,255,.08)}
.pell-home-wrap .pell{border:1px solid rgba(255,255,255,.15)!important;border-radius:8px!important;background:transparent!important}
.pell-home-wrap:focus-within .pell{border-color:rgba(139,92,246,.45)!important;background:rgba(255,255,255,.03)!important}
.btn-add-widget{border:1px dashed rgba(6,182,212,.4);border-radius:10px;padding:10px;font-size:13px;margin-top:4px;color:#22d3ee;background:rgba(6,182,212,.08)}
.widget-type-btn{display:flex;align-items:center;gap:10px;padding:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:10px;cursor:pointer;color:#e2e8f0;font-size:14px;font-weight:500;transition:background .15s;width:100%}
.widget-type-btn:hover{background:rgba(139,92,246,.15)}
.widget-type-icon{font-size:22px;width:36px;text-align:center}
/* Bookmarks widget */
.widget-bookmarks{padding:12px}
.bookmarks-grid{display:flex;flex-wrap:wrap;gap:8px}
.bookmark-item{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:8px;text-decoration:none;color:#e2e8f0;font-size:12px;font-weight:600;transition:background .15s;white-space:nowrap}
.bookmark-item:hover{background:rgba(139,92,246,.15)}
.bookmark-item img{width:18px;height:18px;border-radius:4px;object-fit:contain}
/* Image widget */
.widget-image{padding:0;overflow:hidden}
.widget-image img{width:100%;height:auto;border-radius:8px;display:block;min-height:60px;object-fit:cover}
.widget-image .img-caption{font-size:11px;color:#64748b;text-align:left;padding:8px 12px 10px;line-height:1.4}
/* Separator widget */
.widget-separator{padding:8px 0;margin:4px 0}
.widget-separator hr{border:none;border-top:1px solid rgba(255,255,255,.08)}
.widget-separator.has-label{display:flex;align-items:center;gap:12px}
.widget-separator .sep-label{font-size:11px;color:#64748b;font-weight:600;text-transform:uppercase;letter-spacing:1px;white-space:nowrap}
.widget-separator .sep-line{flex:1;height:1px;background:rgba(255,255,255,.08)}
/* Countdown widget */
.widget-countdown{display:flex;flex-direction:column;align-items:center;padding:16px}
.countdown-label{font-size:12px;color:#94a3b8;font-weight:600;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.countdown-boxes{display:flex;gap:8px}
.countdown-box{display:flex;flex-direction:column;align-items:center;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:8px;padding:8px 12px;min-width:52px}
.countdown-box .cd-num{font-size:24px;font-weight:800;color:#fff;line-height:1}
.countdown-box .cd-unit{font-size:9px;color:#64748b;font-weight:600;text-transform:uppercase;margin-top:2px}
.countdown-past .cd-num{color:#ef4444}
/* Iframe widget */
.widget-iframe{padding:0;overflow:hidden;border-radius:12px;border:1px solid rgba(255,255,255,.06)}
.widget-iframe iframe{width:100%;border:none;display:block;background:transparent}
/* Weather widget */
.widget-weather{padding:14px 16px;display:flex;flex-direction:column;align-items:center}
.weather-header{display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.weather-city{font-size:12px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:1px}
.weather-today{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.06)}
.weather-today-icon{font-size:42px;line-height:1}
.weather-today-info{display:flex;flex-direction:column}
.weather-today-temp{font-size:32px;font-weight:800;color:#fff;line-height:1}
.weather-today-desc{font-size:11px;color:#94a3b8;margin-top:3px;text-transform:uppercase;letter-spacing:.5px}
.weather-forecast{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;width:100%}
.weather-day{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;min-width:36px;padding:6px 4px;border-radius:8px;background:rgba(255,255,255,.03)}
.weather-day-name{font-size:9px;color:#64748b;font-weight:600;text-transform:uppercase}
.weather-day-icon{font-size:18px;line-height:1}
.weather-day-temp{font-size:11px;font-weight:700;color:#e2e8f0}
.weather-day-min{font-size:10px;color:#64748b}
.weather-city-search{position:relative}
.weather-city-results{position:fixed;z-index:9999;background:#1e2030;border:1px solid rgba(255,255,255,.12);border-radius:8px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.weather-city-result{padding:8px 12px;cursor:pointer;font-size:12px;border-bottom:1px solid rgba(255,255,255,.05);transition:background .1s}
.weather-city-result:last-child{border-bottom:none}
.weather-city-result:hover{background:rgba(139,92,246,.2)}
.weather-city-result .wcr-name{font-weight:700;color:#e2e8f0}
.weather-city-result .wcr-sub{color:#64748b;font-size:11px;margin-top:1px}
.weather-city-selected{display:flex;align-items:center;gap:6px;padding:6px 10px;background:rgba(139,92,246,.15);border:1px solid rgba(139,92,246,.3);border-radius:8px;font-size:12px;margin-top:4px}
.weather-city-selected span{flex:1;color:#e2e8f0;font-weight:600}
.weather-city-selected button{background:none;border:none;color:#64748b;cursor:pointer;padding:0;font-size:14px;line-height:1}
.weather-city-selected button:hover{color:#ef4444}
/* Integration widgets */
.widget-integration{padding:14px}
.integ-header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.integ-icon{font-size:18px}
.integ-title{font-size:12px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:1px}
.integ-loading{color:#64748b;font-size:12px;font-style:italic}
.integ-error{color:#ef4444;font-size:11px}
.integ-list{display:flex;flex-direction:column;gap:4px}
.integ-row{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;background:rgba(255,255,255,.03);border-radius:6px;font-size:12px;gap:8px}

<body>
<div id="wp-layer" style="display:none;position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0"></div>
<div class="shell" id="shell"><div class="container" id="app"></div></div>
<script src="/purify.min.js"></script>
<script src="/pell.min.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════════
const EMPTY_PAGE = () => ({id:"page_"+uid(),title:"New Page",tags:{PWA:"#8b5cf6",APP:"#10b981",SELFHOSTED:"#6b7280",CLOUD:"#f59e0b",DOCKER:"#3b82f6",API:"#ec4899"},wallpaperDesktop:"",categories:[]});

const DEFAULT_CONFIG = {
  currentPage: 0,
  pages: [{
    id:"page_1", title:"ROAMPAGE",
    tags:{PWA:"#8b5cf6",APP:"#10b981",SELFHOSTED:"#6b7280",CLOUD:"#f59e0b",DOCKER:"#3b82f6",API:"#ec4899"},
    categories:[]
  }]
};

const DEFAULT_TAG_COLORS=["#8b5cf6","#10b981","#6b7280","#f59e0b","#3b82f6","#ec4899","#ef4444","#06b6d4","#f97316","#84cc16"];
let config=JSON.parse(JSON.stringify(DEFAULT_CONFIG));
let editMode=false, columns=2, popupService=null, jsonModal="", jsonText="", saveTimeout=null;
let backupModal=false, backups=[];
let iconBrowserOpen=false, iconBrowserCat=0, iconBrowserSvc=0, iconBrowserSearch="", allIcons=null, iconBrowserLoading=false;
let widgetPickerCat=-1; // -1 = hidden, >=0 = category index
let bmIconTarget=null; // {ci, si, li} for bookmark icon browser
// Health: keyed by URL for per-server granularity
let healthByUrl={};
let healthInterval=null;
const openSvcBodies=new Set();
let searchQuery = "";
let healthCache = JSON.parse(localStorage.getItem('roampage-health') || '{}');
const HEALTH_CACHE_MAX_ENTRIES = 200;
function saveHealthCache() {
  // Prune oldest entries if cache is too large
  const keys = Object.keys(healthCache);
  if (keys.length > HEALTH_CACHE_MAX_ENTRIES) {
    keys.sort((a, b) => (healthCache[a].timestamp || 0) - (healthCache[b].timestamp || 0));
    for (const k of keys.slice(0, keys.length - HEALTH_CACHE_MAX_ENTRIES)) delete healthCache[k];
  }
  try { localStorage.setItem('roampage-health', JSON.stringify(healthCache)); } catch (e) {
    // QuotaExceededError: clear and retry
    healthCache = {};
    try { localStorage.removeItem('roampage-health'); } catch {}
  }
}

const uid=()=>Math.random().toString(36).slice(2,10);
const isMobile=()=>window.innerWidth<700;
const $=s=>document.querySelector(s);
const h=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function page(){return config.pages[config.currentPage]||config.pages[0];}
function slugify(s){return(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"page";}
function pageSlug(pg){return pg.slug||slugify(pg.title);}
function findPageBySlug(slug){if(!slug||slug==="/")return 0;slug=slug.replace(/^\//,"");const i=config.pages.findIndex(p=>pageSlug(p)===slug);return i>=0?i:0;}
function pushPageUrl(){const slug=pageSlug(page());history.replaceState(null,"","/"+slug);}
window.addEventListener("popstate",()=>{config.currentPage=findPageBySlug(location.pathname);render();startHealthLoop();});
function getTagColor(t){const p=page();return p.tags&&p.tags[t]?p.tags[t]:"#6b7280";}
function getAllTags(){const p=page();return p.tags?Object.keys(p.tags):[];}

function autoPrefix(url){url=(url||"").trim();if(!url)return url;if(/^https?:\/\//i.test(url))return url;if(/^(\d{1,3}\.){3}\d{1,3}(:\d+)?/.test(url))return"http://"+url;if(/^localhost(:\d+)?/.test(url))return"http://"+url;return"https://"+url;}

function compressImage(file,maxWidth,maxHeight,quality){
  return new Promise((resolve)=>{
    const img=new Image();const reader=new FileReader();
    reader.onload=()=>{
      img.onload=()=>{
        let w=img.width,ht=img.height;
        const isPortrait=ht>w;
        const ratio=Math.min(w>maxWidth?maxWidth/w:1,ht>maxHeight?maxHeight/ht:1);
        w=Math.round(w*ratio);ht=Math.round(ht*ratio);
        const c=document.createElement("canvas");c.width=w;c.height=ht;
        const ctx=c.getContext("2d");ctx.drawImage(img,0,0,w,ht);
        // Try webp first, fallback to jpeg
        let dataUrl=c.toDataURL("image/webp",quality);
        if(!dataUrl.startsWith("data:image/webp"))dataUrl=c.toDataURL("image/jpeg",quality);
        const origKB=Math.round(file.size/1024);
        const newKB=Math.round(dataUrl.length*0.75/1024);
        console.log(`Wallpaper compressed: ${origKB}KB → ${newKB}KB (${w}×${ht}) ${isPortrait?"portrait":"landscape"}`);
        resolve({dataUrl,isPortrait});
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// ═══════════════════════════════════════════════════════════════
// API
// ═══════════════════════════════════════════════════════════════
async function loadConfig(){
  try{const res=await fetch("/api/config");const data=await res.json();
    if(data&&data.pages)config=data;
    else if(data&&data.categories){config={currentPage:0,pages:[data]};} // migrate old format
  }catch(e){}
  if(!config.pages||!config.pages.length)config.pages=[EMPTY_PAGE()];
  if(config.currentPage>=config.pages.length)config.currentPage=0;
  // Route to page based on URL slug
  const urlPage=findPageBySlug(location.pathname);
  if(urlPage>=0)config.currentPage=urlPage;
  const now = Date.now();
  for (const [url, data] of Object.entries(healthCache)) {
    // Only pre-populate from cache if the entry is recent (< 5 min)
    if (data.timestamp && now - data.timestamp < 5 * 60 * 1000) {
      healthByUrl[url] = data.status;
    } else {
      delete healthCache[url]; // prune stale entries at startup
    }
  }
  render();startHealthLoop();pushPageUrl();
}
function saveConfig(){clearTimeout(saveTimeout);saveTimeout=setTimeout(async()=>{try{await fetch("/api/config",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(config)})}catch(e){}},500);}

// ═══════════════════════════════════════════════════════════════
// HEALTH CHECKS (client-side, per URL)
// ═══════════════════════════════════════════════════════════════
async function checkUrl(url) {
  // Check local cache first (5 min TTL)
  const cached = healthCache[url];
  if (cached && Date.now() - cached.timestamp < 5 * 60 * 1000) {
    return cached;
  }

  // Always use server relay: direct fetch with no-cors cannot read HTTP status,
  // so a 500 or 404 would incorrectly appear as "up".
  try {
    const resp = await fetch(`/api/health?url=${encodeURIComponent(url)}`);
    const data = await resp.json();
    const result = { status: data.status, timestamp: Date.now() };
    healthCache[url] = result;
    saveHealthCache();
    return result;
  } catch (e) {
    console.warn(`[Client] Server health check failed for ${url}:`, e.message);
    const result = { status: 'down', timestamp: Date.now() };
    healthCache[url] = result;
    saveHealthCache();
    return result;
  }
}

async function runHealthChecks(){
  const urls=new Set();
  for(const p of config.pages)for(const cat of p.categories)for(const svc of cat.services)for(const srv of svc.servers||[])if(srv.url){const u=autoPrefix(srv.url);urls.add(u);if(!healthByUrl[u])healthByUrl[u]="checking";}
  updateAllStatus();
  await Promise.all([...urls].map(async u=>{
    healthByUrl[u] = 'checking';
    updateAllStatus();
    const result = await checkUrl(u);
    healthByUrl[u] = result.status;
    updateAllStatus();
  }));
}
function getServerStatus(url){return healthByUrl[autoPrefix(url)]||"checking";}
function getSvcStatus(svc){
  if(svc.type)return null; // widgets have no status
  if(!svc.servers||!svc.servers.length)return"checking";
  // Up if first server is up
  const first=svc.servers[0];
  if(first&&first.url)return getServerStatus(first.url);
  return"checking";
}
function updateAllStatus(){
  document.querySelectorAll("[data-health-url]").forEach(el=>{
    const s=getServerStatus(el.dataset.healthUrl);
    const dot=el.querySelector(".status-dot"),lbl=el.querySelector(".status-label");
    if(dot)dot.className="status-dot "+s;if(lbl){lbl.className="status-label "+s;lbl.textContent=s;}
  });
  document.querySelectorAll("[data-health-svc]").forEach(el=>{
    const id=el.dataset.healthSvc;
    for(const cat of page().categories){const svc=cat.services.find(s=>s.id===id);if(svc){
      const s=getSvcStatus(svc);const dot=el.querySelector(".status-dot"),lbl=el.querySelector(".status-label");
      if(dot)dot.className="status-dot "+s;if(lbl){lbl.className="status-label "+s;lbl.textContent=s;}
      break;
    }}
  });
}
function startHealthLoop(){if(healthInterval)clearInterval(healthInterval);runHealthChecks();healthInterval=setInterval(runHealthChecks,60000);}

// ═══════════════════════════════════════════════════════════════
// ICON BROWSER
// ═══════════════════════════════════════════════════════════════
async function loadIcons(){if(allIcons)return;iconBrowserLoading=true;renderIconBrowserContent();try{const res=await fetch("/api/icons");allIcons=await res.json();}catch(e){allIcons=[];}iconBrowserLoading=false;renderIconBrowserContent();}
function getFilteredIcons(){if(!allIcons)return[];const q=iconBrowserSearch.toLowerCase().trim();if(!q)return allIcons.slice(0,80);return allIcons.filter(n=>n.includes(q)).slice(0,80);}
function renderIconBrowserContent(){const c=document.getElementById("icon-browser-results");if(!c)return;if(iconBrowserLoading){c.innerHTML='<div class="icon-browser-loading">Loading icons...</div>';return;}const f=getFilteredIcons();if(!f.length){c.innerHTML='<div class="icon-browser-empty">No icons found</div>';return;}const cur=page().categories[iconBrowserCat]?.services[iconBrowserSvc]?.icon||"";c.innerHTML=f.map(n=>{const p="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/"+n+".png";const sel=cur.includes("/"+n+".")?" selected":"";return`<div class="icon-browser-item${sel}" data-action="pick-icon" data-icon-name="${h(n)}"><img src="${h(p)}" alt="${h(n)}" loading="lazy" onerror="this.style.opacity=0.2"><span>${h(n)}</span></div>`;}).join("");}
function renderIconBrowser(){if(!iconBrowserOpen)return"";const sn=page().categories[iconBrowserCat]?.services[iconBrowserSvc]?.name||"service";return`<div class="icon-browser-overlay" id="icon-browser-overlay"><div class="icon-browser"><div style="display:flex;align-items:center;justify-content:space-between"><div style="font-weight:700;color:#e2e8f0;font-size:15px">🔍 Pick an icon</div><button class="icon-btn" data-action="close-icon-browser" style="padding:4px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div><div style="font-size:12px;color:#64748b">Selecting icon for <strong style="color:#e2e8f0">${h(sn)}</strong> — ${allIcons?allIcons.length+" icons":"loading..."}</div><input class="edit-input" id="icon-search-input" value="${h(iconBrowserSearch)}" placeholder="Search icons..." data-action="icon-search" autofocus><div class="icon-browser-grid" id="icon-browser-results"></div></div></div>`;}

function renderWidgetPicker(){
  if(widgetPickerCat<0)return"";
  const ci=widgetPickerCat;
  const w=(type,icon,name,desc)=>`<button class="widget-type-btn" data-action="add-widget" data-wtype="${type}" data-cat="${ci}"><span class="widget-type-icon">${icon}</span><div><div style="font-weight:600">${name}</div><div style="font-size:11px;color:#94a3b8">${desc}</div></div></button>`;
  const ig=(itype,icon,name,desc)=>`<button class="widget-type-btn" data-action="add-integration" data-itype="${itype}" data-cat="${ci}"><span class="widget-type-icon">${icon}</span><div><div style="font-weight:600">${name}</div><div style="font-size:11px;color:#94a3b8">${desc}</div></div></button>`;
  return`<div class="overlay" id="widget-picker-overlay"><div class="popup" style="min-width:320px;max-height:80vh;overflow-y:auto"><div style="font-weight:700;color:#e2e8f0;font-size:15px;margin-bottom:12px">Widgets</div><div style="display:flex;flex-direction:column;gap:6px">${w("widget-clock","🕐","Clock","Time and date display")}${w("widget-weather","🌤","Weather","7-day forecast by city")}${w("widget-bookmarks","🔗","Bookmarks","Quick links grid")}${w("widget-text","📝","Text","Rich text with formatting")}${w("widget-image","🖼","Image","Display an image or banner")}${w("widget-iframe","🪟","Iframe","Embed an external page")}${w("widget-countdown","⏳","Countdown","Countdown to a date")}${w("widget-separator","➖","Separator","Divider line with optional label")}</div><div style="font-weight:700;color:#e2e8f0;font-size:15px;margin:16px 0 12px;border-top:1px solid rgba(255,255,255,.08);padding-top:16px">Integrations</div><div style="display:flex;flex-direction:column;gap:6px">${ig("jellyfin","🎬","Jellyfin","Currently playing")}${ig("pihole","🛡","Pi-hole","DNS blocking stats")}${ig("system","💻","System","CPU, RAM, Disk usage")}</div></div></div>`;
}

// ═══════════════════════════════════════════════════════════════
// RENDER HELPERS
// ═══════════════════════════════════════════════════════════════
function renderTag(t){return`<span class="tag" style="background:${getTagColor(t)}">${h(t)}</span>`;}
function renderSvcStatus(svc){
  const status = getSvcStatus(svc);
  if(!status)return"";
  return `<div class="status" data-health-svc="${h(svc.id)}"><span class="status-dot ${status}"></span><span class="status-label ${status}">${status}</span></div>`;
}

function renderClockWidget(svc){
  return`<div class="widget widget-clock" id="clock-${h(svc.id)}"><div class="clock-time"><span class="clock-hm">--:--</span><span class="clock-seconds">:--</span></div><div class="clock-date">---</div></div>`;
}
function renderTextWidget(svc){
  return`<div class="widget widget-text" id="text-widget-${h(svc.id)}" data-widget-id="${h(svc.id)}"><div class="pell-home-wrap" id="pell-home-${h(svc.id)}" data-widget-id="${h(svc.id)}"></div></div>`;
}
function renderBookmarksWidget(svc){
  const links=(svc.links||[]).map(lk=>{
    const icon=lk.icon?`<img src="${h(lk.icon)}" alt="" onerror="this.style.display='none'">`:"";
    return`<a class="bookmark-item" href="${h(autoPrefix(lk.url))}" target="_blank" rel="noopener noreferrer">${icon}${h(lk.label)}</a>`;
  }).join("");
  return`<div class="widget widget-bookmarks"><div class="bookmarks-grid">${links||'<span style="color:#64748b;font-size:12px">No bookmarks yet</span>'}</div></div>`;
}
function renderImageWidget(svc){
  if(!svc.imageUrl)return`<div class="widget widget-image" style="padding:16px"><div style="color:#64748b;font-size:12px;text-align:center">No image set</div></div>`;
  const link=svc.linkUrl?`<a href="${h(autoPrefix(svc.linkUrl))}" target="_blank" rel="noopener noreferrer">`:"";
  const linkEnd=svc.linkUrl?"</a>":"";
  const caption=svc.imageCaption?`<div class="img-caption">${h(svc.imageCaption)}</div>`:"";
  return`<div class="widget widget-image">${link}<img src="${h(svc.imageUrl)}" alt="${h(svc.altText||"")}" loading="lazy" decoding="async">${linkEnd}${caption}</div>`;
}
function renderSeparatorWidget(svc){
  if(svc.label){return`<div class="widget widget-separator has-label"><span class="sep-line"></span><span class="sep-label">${h(svc.label)}</span><span class="sep-line"></span></div>`;}
  return`<div class="widget widget-separator"><hr></div>`;
}
function renderCountdownWidget(svc){
  return`<div class="widget widget-countdown" id="cd-${h(svc.id)}" data-target="${h(svc.targetDate||"")}" data-label="${h(svc.label||"")}"><div class="countdown-label">${h(svc.label||"Countdown")}</div><div class="countdown-boxes"><div class="countdown-box"><span class="cd-num cd-days">--</span><span class="cd-unit">days</span></div><div class="countdown-box"><span class="cd-num cd-hrs">--</span><span class="cd-unit">hrs</span></div><div class="countdown-box"><span class="cd-num cd-min">--</span><span class="cd-unit">min</span></div><div class="countdown-box"><span class="cd-num cd-sec">--</span><span class="cd-unit">sec</span></div></div></div>`;
}
// WMO weather code → emoji + label
function weatherIcon(code){
  if(code===0)return{icon:"☀️",label:"Clear"};
  if(code<=2)return{icon:"⛅",label:"Partly cloudy"};
  if(code===3)return{icon:"☁️",label:"Overcast"};
  if(code<=49)return{icon:"🌫️",label:"Fog"};
  if(code<=59)return{icon:"🌦️",label:"Drizzle"};
  if(code<=69)return{icon:"🌧️",label:"Rain"};
  if(code<=79)return{icon:"❄️",label:"Snow"};
  if(code<=82)return{icon:"🌧️",label:"Showers"};
  if(code<=84)return{icon:"🌨️",label:"Snow showers"};
  if(code<=99)return{icon:"⛈️",label:"Thunderstorm"};
  return{icon:"🌡️",label:"Unknown"};
}
const DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function renderWeatherWidget(svc){
  const d=svc._weatherData;
  if(!svc.weatherLat||!svc.weatherLon)return`<div class="widget widget-weather"><span class="integ-loading">Configure a city in settings</span></div>`;
  if(!d)return`<div class="widget widget-weather" id="weather-${h(svc.id)}"><div class="weather-header"><span class="weather-city">${h(svc.weatherCity)}</span></div><span class="integ-loading">Loading...</span></div>`;
  if(d.error)return`<div class="widget widget-weather" id="weather-${h(svc.id)}"><span class="integ-error">⚠ ${h(d.error)}</span></div>`;
  const today=d.daily[0];
  const {icon,label}=weatherIcon(today.weathercode);
  const unit=svc.weatherUnit==="fahrenheit"?"°F":"°C";
  const forecast=d.daily.slice(1).map(day=>{
    const {icon:di}=weatherIcon(day.weathercode);
    const name=DAYS[new Date(day.date).getDay()];
    return`<div class="weather-day"><span class="weather-day-name">${name}</span><span class="weather-day-icon">${di}</span><span class="weather-day-temp">${Math.round(day.temp_max)}${unit}</span><span class="weather-day-min">${Math.round(day.temp_min)}${unit}</span></div>`;
  }).join("");
  return`<div class="widget widget-weather" id="weather-${h(svc.id)}"><div class="weather-header"><span class="weather-city">📍 ${h(d.city||svc.weatherCity)}</span></div><div class="weather-today"><span class="weather-today-icon">${icon}</span><div class="weather-today-info"><span class="weather-today-temp">${Math.round(today.temp_max)}${unit}</span><span class="weather-today-desc">${label} · ${Math.round(today.temp_min)}${unit} min</span></div></div><div class="weather-forecast">${forecast}</div></div>`;
}
function renderIframeWidget(svc){
  if(!svc.iframeUrl)return`<div class="widget widget-iframe" style="padding:16px"><div style="color:#64748b;font-size:12px;text-align:center">No URL set</div></div>`;
  const ht=svc.iframeHeight||200;
  return`<div class="widget widget-iframe"><iframe src="${h(svc.iframeUrl)}" height="${ht}" loading="lazy" sandbox="allow-scripts allow-same-origin allow-popups"></iframe></div>`;
}

// ═══════════════════════════════════════════════════════════════
// INTEGRATION WIDGETS
// ═══════════════════════════════════════════════════════════════
function renderIntegrationWidget(svc){
  return`<div class="widget widget-integration" id="integ-${h(svc.id)}" data-integ-type="${h(svc.integType)}" data-integ-id="${h(svc.id)}"><div class="integ-header"><span class="integ-icon">${integIcons[svc.integType]||"📊"}</span><span class="integ-title">${h(svc.integLabel||svc.integType)}</span></div><div class="integ-body"><span class="integ-loading">Loading...</span></div></div>`;
}

const integIcons={jellyfin:"🎬",pihole:"🛡",system:"💻"};

function formatBytes(b){if(!b)return"0 B";const u=["B","KB","MB","GB","TB"];const i=Math.floor(Math.log(b)/Math.log(1024));return(b/Math.pow(1024,i)).toFixed(i>1?1:0)+" "+u[i];}
function formatUptime(s){const d=Math.floor(s/86400),h=Math.floor((s%86400)/3600),m=Math.floor((s%3600)/60);return d>0?`${d}d ${h}h`:h>0?`${h}h ${m}m`:`${m}m`;}

function renderIntegrationData(el,type,data){
  const body=el.querySelector(".integ-body");if(!body)return;
  if(data.error){body.innerHTML=`<span class="integ-error">⚠ ${h(data.error)}</span>`;return;}

  if(type==="jellyfin"){
    if(!data.length){body.innerHTML=`<span class="integ-loading">No active sessions</span>`;return;}
    body.innerHTML=`<div class="integ-list">${data.map(s=>{
      const isPlaying=s.state==="playing";const isPaused=s.state==="paused";
      const badge=isPlaying?'<span class="badge-up">▶</span>':isPaused?'<span class="badge-paused">⏸</span>':'<span class="meta">💤</span>';
      const title=s.state==="idle"?`<span style="color:#64748b">${h(s.device||"Idle")}</span>`:h(s.series?s.series+" — "+s.title:s.title);

  }

  }
}

let integInterval=null;
let integCurrentPage=-1; // tracks which page integrations are running for
const integDataCache=new Map(); // id → {data, type, ts}
const INTEG_CLIENT_TTL=25*1000; // reuse cached data if fresher than 25s

// Repaint integration widgets from client cache (instant, no network)
function repaintIntegrations(){
  document.querySelectorAll(".widget-integration").forEach(el=>{
    const id=el.dataset.integId;const type=el.dataset.integType;
    const cached=integDataCache.get(id);
    if(cached)renderIntegrationData(el,type,cached.data);
  });
}

function startIntegrations(){
  if(integInterval)clearInterval(integInterval);
  function fetchAll(){
    // Integration widgets
    document.querySelectorAll(".widget-integration").forEach(async el=>{
      const id=el.dataset.integId;const type=el.dataset.integType;
      let svc=null;
      for(const pg of config.pages)for(const cat of pg.categories)for(const s of cat.services)if(s.id===id){svc=s;break;}
      if(!svc)return;
      // Repaint from cache immediately while waiting for network
      const cached=integDataCache.get(id);
      if(cached)renderIntegrationData(el,type,cached.data);
      // Skip network fetch if cache is still fresh
      if(cached&&Date.now()-cached.ts<INTEG_CLIENT_TTL)return;
      const body={};
      if(svc.integUrl)body.url=svc.integUrl;
      if(svc.integApiKey)body.apiKey=svc.integApiKey;
      try{
        const res=await fetch(`/api/integration/${type}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
        const data=await res.json();
        if(!data.error)integDataCache.set(id,{data,type,ts:Date.now()});
        renderIntegrationData(el,type,data);
      }catch(e){
        renderIntegrationData(el,type,{error:e.message});
      }
    });
    // Weather widgets — update innerHTML only, never replace the node (avoids layout shifts)
    document.querySelectorAll(".widget-weather").forEach(async el=>{
      const id=el.id.replace("weather-","");
      let svc=null;
      for(const pg of config.pages)for(const cat of pg.categories)for(const s of cat.services)if(s.id===id){svc=s;break;}
      if(!svc||!svc.weatherLat||!svc.weatherLon)return;
      try{
        const params=new URLSearchParams({lat:svc.weatherLat,lon:svc.weatherLon,city:svc.weatherCity||"",unit:svc.weatherUnit||"celsius"});
        const res=await fetch(`/api/weather?${params}`);
        const data=await res.json();
        svc._weatherData=data;
      }catch(e){
        svc._weatherData={error:e.message};
      }
      // Parse the rendered HTML and inject only the inner content into the existing node
      const tmp=document.createElement("div");
      tmp.innerHTML=renderWeatherWidget(svc);
      const newEl=tmp.firstElementChild;
      if(newEl)el.innerHTML=newEl.innerHTML;
    });
  }
  integCurrentPage=config.currentPage;
  fetchAll();
  // Integration widgets (jellyfin/pihole/system) need frequent refresh;
  // weather is cached server-side for 30 min so fetching every 30s is fine (no extra API calls).
  integInterval=setInterval(fetchAll,30*1000);
}

function initHomeTextWidgets(){
  document.querySelectorAll(".pell-home-wrap").forEach(container=>{
    if(container.dataset.pellInit)return;
    container.dataset.pellInit="1";

    if(!svc)return;
    const editor=pell.init({
      element:container,
      onChange:html=>{svc.content=html;saveConfig();},
      actions:["bold","italic","underline","strikethrough","heading1","heading2","olist","ulist","link"]
    });
    editor.content.innerHTML=DOMPurify.sanitize(svc.content||"<em>Click to edit...</em>");
    // Force dynamic height - remove any inline/inherited min-height
    editor.content.style.minHeight="0";
    editor.content.style.height="auto";
    // Fix: ensure clicking pell-content always places cursor correctly
    editor.content.addEventListener("mousedown",function(e){
      // Let the default mousedown place the caret
      this.focus();
    });

    editor.content.addEventListener("focus",function(){
      const txt=this.textContent.trim();
      if(txt==="Click to edit..."){
        const range=document.createRange();
        range.selectNodeContents(this);
        const sel=window.getSelection();
        sel.removeAllRanges();sel.addRange(range);
      }
    });

}

let clockInterval=null;
function startClocks(){
  if(clockInterval)clearInterval(clockInterval);
  function tick(){
    document.querySelectorAll(".widget-clock").forEach(el=>{
      const now=new Date();
      const hm=el.querySelector(".clock-hm");
      const sec=el.querySelector(".clock-seconds");
      const dt=el.querySelector(".clock-date");
      if(hm)hm.textContent=now.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",hour12:false});
      if(sec)sec.textContent=":"+String(now.getSeconds()).padStart(2,"0");
      if(dt)dt.textContent=now.toLocaleDateString([],{weekday:"long",day:"numeric",month:"long",year:"numeric"});
    });
    document.querySelectorAll(".widget-countdown").forEach(el=>{
      const target=el.dataset.target;if(!target)return;
      const diff=new Date(target).getTime()-Date.now();
      const past=diff<0;const abs=Math.abs(diff);
      const d=Math.floor(abs/86400000),hr=Math.floor((abs%86400000)/3600000),mn=Math.floor((abs%3600000)/60000),sc=Math.floor((abs%60000)/1000);
      const dd=el.querySelector(".cd-days"),hh=el.querySelector(".cd-hrs"),mm=el.querySelector(".cd-min"),ss=el.querySelector(".cd-sec");
      if(dd)dd.textContent=(past?"-":"")+d;if(hh)hh.textContent=hr;if(mm)mm.textContent=mn;if(ss)ss.textContent=sc;
      el.querySelector(".countdown-boxes").classList.toggle("countdown-past",past);
    });
  }
  tick();
  clockInterval=setInterval(tick,1000);
}

function initPellEditors(){
  document.querySelectorAll(".pell-editor-container").forEach(container=>{
    if(container.dataset.pellInit)return;
    container.dataset.pellInit="1";
    const ci=parseInt(container.dataset.cat),si=parseInt(container.dataset.svc);
    const svc=page().categories[ci]?.services[si];
    if(!svc)return;
    const editor=pell.init({
      element:container,
      onChange:html=>{svc.content=html;saveConfig();},
      actions:["bold","italic","underline","strikethrough","heading1","heading2","olist","ulist","link"]
    });
    editor.content.innerHTML=DOMPurify.sanitize(svc.content||"");
  });
}

function render(){
  const app=$("#app");const p=page();const mobile=isMobile();const ec=mobile?1:columns;
  const wasSearchFocused = document.activeElement && document.activeElement.classList.contains("search-input");
  let searchSelectionStart = -1, searchSelectionEnd = -1;
  if (wasSearchFocused) {
    const currentSi = $(".search-input");
    if (currentSi) {
      searchSelectionStart = currentSi.selectionStart;
      searchSelectionEnd = currentSi.selectionEnd;
    }
  }
  // Preserve focused edit-input state across re-renders
  const activeEl = document.activeElement;
  const wasEditFocused = activeEl && activeEl.classList.contains("edit-input") && !activeEl.classList.contains("json-textarea");
  let editFocusKey = null, editFocusSelStart = -1, editFocusSelEnd = -1;
  if (wasEditFocused) {
    editFocusSelStart = activeEl.selectionStart;
    editFocusSelEnd = activeEl.selectionEnd;
    editFocusKey = JSON.stringify({
      action: activeEl.dataset.action||"",
      cat: activeEl.dataset.cat||"",
      svc: activeEl.dataset.svc||"",
      srv: activeEl.dataset.srv||"",
      field: activeEl.dataset.field||"",
    });
  }
  const cfgIcon=editMode?`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>Done`:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12.22 2h-.44a2 2 0 00-2 2v.18a2 2 0 01-1 1.73l-.43.25a2 2 0 01-2 0l-.15-.08a2 2 0 00-2.73.73l-.22.38a2 2 0 00.73 2.73l.15.1a2 2 0 011 1.72v.51a2 2 0 01-1 1.74l-.15.09a2 2 0 00-.73 2.73l.22.38a2 2 0 002.73.73l.15-.08a2 2 0 012 0l.43.25a2 2 0 011 1.73V20a2 2 0 002 2h.44a2 2 0 002-2v-.18a2 2 0 011-1.73l.43-.25a2 2 0 012 0l.15.08a2 2 0 002.73-.73l.22-.39a2 2 0 00-.73-2.73l-.15-.08a2 2 0 01-1-1.74v-.5a2 2 0 011-1.74l.15-.09a2 2 0 00.73-2.73l-.22-.38a2 2 0 00-2.73-.73l-.15.08a2 2 0 01-2 0l-.43-.25a2 2 0 01-1-1.73V4a2 2 0 00-2-2z"/><circle cx="12" cy="12" r="3"/></svg>Config`;

  // Page tabs
  const tabs=config.pages.map((pg,i)=>{
    const active=i===config.currentPage?" active":"";
    const del=config.pages.length>1&&editMode?` <span class="page-tab-del" data-action="del-page" data-page="${i}">×</span>`:"";
    return`<button class="page-tab${active}" data-action="switch-page" data-page="${i}">${h(pg.title||"Page "+(i+1))}${del}</button>`;
  }).join("");
  const tabBar=`<div class="page-tabs">${tabs}<button class="page-tab-add" data-action="add-page">+</button></div>`;

  let body;
  if(editMode){
    const cats=p.categories.map((c,i)=>renderEditCategory(c,i,p.categories.length)).join("");
    body=`<div class="edit-section"><label class="edit-label">Page title</label><input class="edit-input" value="${h(p.title)}" data-action="edit-title"></div>${cats}<button class="btn-add btn-add-cat" data-action="add-cat">+ Add category</button>${renderGlobalTagsEditor()}${renderWallpaperEditor()}<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn-small" data-action="json-pick-export">⬆ Export JSON</button><button class="btn-small" data-action="json-pick-import">⬇ Import JSON</button><button class="btn-small" style="background:rgba(34,197,94,.08);border-color:rgba(34,197,94,.3);color:#22c55e" data-action="open-backups">📦 Backups</button></div>`;
  } else if(!p.categories.length){
    body=`<div class="empty-page">Click on <strong>Config</strong> in the top right to get started!</div>`;
  } else {
    const cats=p.categories;let gc;
    if(ec===2&&cats.length>1){const mid=Math.ceil(cats.length/2);gc=`<div>${cats.slice(0,mid).map(renderCategory).join("")}</div><div>${cats.slice(mid).map(renderCategory).join("")}</div>`;}
    else{gc=`<div>${cats.map(renderCategory).join("")}</div>`;}

    body=`${colBtn}<div class="grid cols-${ec}">${gc}</div><div class="hint">Tap services with <span>×N</span> to choose a server</div>`;
  }

  app.innerHTML=`<div class="header"><div class="header-left"><img src="/logo.png" class="header-logo" alt="Roampage"><h1>${editMode?"⚙ EDIT":h(p.title)}</h1>${!editMode?`<input class="search-input" placeholder="Search... (Ctrl+K)" value="${h(searchQuery)}">`:""}</div><button class="btn-config ${editMode?"active":""}" data-action="toggle-edit">${cfgIcon}</button></div>${tabBar}${body}${renderPopup(popupService)}${renderJsonModal()}${renderBackupModal()}${renderIconBrowser()}${renderWidgetPicker()}`;
  document.title=p.title||"Roampage";
  applyWallpaper();
  startClocks();
  if(editMode)setTimeout(initPellEditors,0);
  else{setTimeout(initHomeTextWidgets,0);if(integCurrentPage!==config.currentPage)startIntegrations();else repaintIntegrations();}
  if(wasSearchFocused){
    const si=$(".search-input");
    if(si){
      si.focus();
      if(searchSelectionStart >= 0){
        si.setSelectionRange(searchSelectionStart, searchSelectionEnd);
      }
    }
  }
  if(wasEditFocused && editFocusKey){
    const key=JSON.parse(editFocusKey);
    const sel=`input.edit-input[data-action="${key.action}"]${key.cat!=""?`[data-cat="${key.cat}"]`:""}${key.svc!=""?`[data-svc="${key.svc}"]`:""}${key.srv!=""?`[data-srv="${key.srv}"]`:""}${key.field!=""?`[data-field="${key.field}"]`:""}`;
    const el=document.querySelector(sel);
    if(el){
      el.focus();
      const s=editFocusSelStart>=0?editFocusSelStart:el.value.length;
      const e2=editFocusSelEnd>=0?editFocusSelEnd:el.value.length;
      // setTimeout ensures cursor placement runs after browser's default post-focus positioning
      setTimeout(()=>el.setSelectionRange(s,e2),0);
    }
  }
  if(iconBrowserOpen){renderIconBrowserContent();const si=document.getElementById("icon-search-input");if(si){si.focus();si.selectionStart=si.value.length;}}
}

// ── Clipboard fallback (works on HTTP / non-secure contexts) ────
function _fallbackCopy(text){
  const ta=document.createElement("textarea");
  ta.value=text;ta.style.position="fixed";ta.style.opacity="0";
  document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand("copy");}catch(e){}
  document.body.removeChild(ta);
}

// ── JSON import/export helpers (async, called from click handler) ──
async function _fetchToB64(url){
  const r=await fetch(url.split("?")[0]);
  const blob=await r.blob();
  return new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(blob);});
}
async function _uploadB64(name,data){
  const r=await fetch("/api/wallpaper",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,data})});
  const d=await r.json();return d.url||null;
}
// Embed all local images (wallpaper + widget imageUrl) into the page object for export/backup
async function _embedLocalImages(pg){
  // wallpaper
  if(pg.wallpaperDesktop&&pg.wallpaperDesktop.startsWith("/wallpapers/")){
    try{pg.wallpaperDesktopData=await _fetchToB64(pg.wallpaperDesktop);pg.wallpaperDesktop=pg.wallpaperDesktop.split("?")[0].split("/").pop();}catch(e){}
  }
  // widget images
  for(const cat of pg.categories||[]){
    for(const svc of cat.services||[]){
      if(svc.imageUrl&&svc.imageUrl.startsWith("/wallpapers/")){
        try{svc.imageUrlData=await _fetchToB64(svc.imageUrl);svc.imageUrl=svc.imageUrl.split("?")[0].split("/").pop();}catch(e){}
      }
    }
  }
}
// Restore all embedded local images after import/restore
async function _restoreLocalImages(pg){
  // wallpaper
  if(pg.wallpaperDesktopData){
    try{const url=await _uploadB64(pg.wallpaperDesktop||("wp_"+uid()+".webp"),pg.wallpaperDesktopData);if(url)pg.wallpaperDesktop=url+"?t="+Date.now();}catch(e){}
    delete pg.wallpaperDesktopData;
  }
  // widget images
  for(const cat of pg.categories||[]){
    for(const svc of cat.services||[]){
      if(svc.imageUrlData){
        try{const url=await _uploadB64(svc.imageUrl||("img_"+uid()+".webp"),svc.imageUrlData);if(url)svc.imageUrl=url+"?t="+Date.now();}catch(e){}
        delete svc.imageUrlData;
      }
    }
  }
}
async function doJsonExport(){
  const p=page();const exp=JSON.parse(JSON.stringify(p));
  await _embedLocalImages(exp);
  jsonText=JSON.stringify(exp,null,2);jsonModal="export";render();
}
async function doJsonExportAll(){
  const expAll=JSON.parse(JSON.stringify(config));
  for(const pg of expAll.pages)await _embedLocalImages(pg);
  jsonText=JSON.stringify(expAll,null,2);jsonModal="export-all";render();
}
async function doJsonImport(){
  try{
    const ta=$("#json-text");const c=JSON.parse(ta.value);
    if(c.categories===undefined)throw 0;
    await _restoreLocalImages(c);
    config.pages[config.currentPage]=c;jsonModal="";saveConfig();render();
  }catch{const err=$("#json-error");if(err)err.textContent="Invalid JSON — expected a single page object";}
}
async function doJsonImportAll(){
  try{
    const ta=$("#json-text");const c=JSON.parse(ta.value);
    if(!(c.pages&&Array.isArray(c.pages)&&c.pages.length))throw 0;
    for(const pg of c.pages)await _restoreLocalImages(pg);
    config=c;jsonModal="";saveConfig();render();
  }catch{const err=$("#json-error");if(err)err.textContent="Invalid JSON — expected a full config object with pages";}
}

    case"restore-backup":{const name=btn.dataset.name;if(!confirm("Restore this backup for page \""+p.title+"\"? A pre-restore backup will be created first."))break;

    default:if(btn.hasAttribute("data-popup-close")){popupService=null;render();}
  }

        resultsEl.style.left=rect.left+"px";
        resultsEl.style.width=rect.width+"px";
      }
      clearTimeout(el._weatherTimer);
      if(q.length<2){resultsEl.style.display="none";break;}
      positionWeatherDropdown();
      resultsEl.style.display="block";
      resultsEl.innerHTML=`<div class="weather-city-result"><span class="wcr-name" style="color:#64748b">Searching...</span></div>`;
      el._weatherTimer=setTimeout(async()=>{
        try{
          const resp=await fetch(`/api/weather/search?q=${encodeURIComponent(q)}`);
          const results=await resp.json();
          positionWeatherDropdown();
          if(!results.length){resultsEl.innerHTML=`<div class="weather-city-result"><span class="wcr-name" style="color:#64748b">No results found</span></div>`;return;}
          resultsEl.innerHTML=results.map((r,idx)=>{
            const sub=[r.state,r.country].filter(Boolean).join(", ");
            return`<div class="weather-city-result" data-action="weather-pick-city" data-cat="${ci}" data-svc="${si}" data-idx="${idx}" data-name="${h(r.name)}" data-country="${h(r.country_code)}" data-lat="${parseFloat(r.lat)||0}" data-lon="${parseFloat(r.lon)||0}"><div class="wcr-name">${h(r.name)}${r.country_code?" <span style='font-size:10px;opacity:.6'>"+h(r.country_code)+"</span>":""}</div><div class="wcr-sub">${h(sub)}</div></div>`;
          }).join("");
        }catch(e){resultsEl.innerHTML=`<div class="weather-city-result"><span class="wcr-name" style="color:#ef4444">Error: ${h(e.message)}</span></div>`;}
      },350);
      break;
    }
    // Generic widget field editor
    case"edit-widget-field":{const svc=p.categories[ci].services[si];const f=el.dataset.field;if(f==="iframeHeight")svc[f]=parseInt(el.value)||200;else svc[f]=el.value;saveConfig();break;}
    // Bookmark editors
    case"edit-bm-label":{const li=parseInt(el.dataset.li);p.categories[ci].services[si].links[li].label=el.value;saveConfig();break;}
    case"edit-bm-url":{const li=parseInt(el.dataset.li);p.categories[ci].services[si].links[li].url=el.value;saveConfig();break;}
    case"edit-bm-icon":{const li=parseInt(el.dataset.li);p.categories[ci].services[si].links[li].icon=el.value;saveConfig();break;}
  }
});

document.addEventListener("keydown", e => {
  if (e.ctrlKey && e.key === "k") {
    e.preventDefault();
    const si = $(".search-input");
    if (si) si.focus();
  }
});


// Enable draggable only when mousedown is on a drag-safe zone (header, not input/button/textarea)
document.addEventListener("mousedown", e => {
  const t = e.target;
  const isFormEl = t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.tagName==="SELECT"||t.tagName==="BUTTON"||t.isContentEditable;
  const dragEl = t.closest(".edit-cat, .edit-svc");
  if (!dragEl) return;
  dragEl.draggable = !isFormEl;
  if (!isFormEl) {
    const onUp = () => { dragEl.draggable = false; document.removeEventListener("mouseup", onUp); };
    document.addEventListener("mouseup", onUp);
  }
});

document.addEventListener("dragstart", e => {
  const src=e.target;
  if (!src.draggable) { e.preventDefault(); return; }
  if (src.classList.contains("edit-cat")) {
    e.dataTransfer.setData("text/plain", "cat-" + e.target.querySelector("[data-cat]").dataset.cat);
  } else if (e.target.classList.contains("edit-svc")) {
    const catEl = e.target.closest(".edit-cat");
    const cat = catEl.querySelector("[data-cat]").dataset.cat;
    const svc = e.target.querySelector("[data-svc]").dataset.svc;
    e.dataTransfer.setData("text/plain", "svc-" + cat + "-" + svc);
  }
  e.target.classList.add("dragging");
});

document.addEventListener("dragend", e => {
  e.target.classList.remove("dragging");
  e.target.draggable = false;
  document.querySelectorAll(".drop-target-before, .drop-target-after").forEach(el => {
    el.classList.remove("drop-target-before", "drop-target-after");
  });
});

document.addEventListener("dragover", e => {
  e.preventDefault();
  e.dataTransfer.dropEffect = "move";
  document.querySelectorAll(".drop-target-before, .drop-target-after").forEach(el => {
    el.classList.remove("drop-target-before", "drop-target-after");
  });
  const target = e.target.closest(".edit-cat, .edit-svc");
  if (!target) return;
  const rect = target.getBoundingClientRect();
  const midpoint = rect.top + rect.height / 2;
  const shouldInsertBefore = e.clientY < midpoint;
  if (shouldInsertBefore) {
    target.classList.add("drop-target-before");
  } else {
    target.classList.add("drop-target-after");
  }
});

document.addEventListener("drop", e => {
  e.preventDefault();
  const data = e.dataTransfer.getData("text/plain");
  const [type, ...ids] = data.split("-");
  const target = e.target.closest(".edit-cat, .edit-svc");
  if (!target) return;
  const p = page();
  
  const rect = target.getBoundingClientRect();
  const midpoint = rect.top + rect.height / 2;
  const insertBefore = e.clientY < midpoint;
  
  if (type === "cat") {
    const fromIndex = parseInt(ids[0]);
    let toIndex;
    if (target.classList.contains("edit-cat")) {
      toIndex = parseInt(target.querySelector("[data-cat]").dataset.cat);
    } else {
      const catEl = target.closest(".edit-cat");
      toIndex = parseInt(catEl.querySelector("[data-cat]").dataset.cat);
    }
    if (fromIndex !== toIndex) {
      const [cat] = p.categories.splice(fromIndex, 1);
      // After removing fromIndex, indices above it shift down by 1
      let insertAt = insertBefore ? toIndex : toIndex + 1;
      if (fromIndex < toIndex) insertAt--;
      p.categories.splice(insertAt, 0, cat);
      saveConfig();
      render();
    }
  } else if (type === "svc") {
    const fromCat = parseInt(ids[0]);
    const fromSvc = parseInt(ids[1]);
    let toCat, toSvc;
    if (target.classList.contains("edit-cat")) {
      toCat = parseInt(target.querySelector("[data-cat]").dataset.cat);
      toSvc = insertBefore ? 0 : p.categories[toCat].services.length;
    } else if (target.classList.contains("edit-svc")) {
      const catEl = target.closest(".edit-cat");
      toCat = parseInt(catEl.querySelector("[data-cat]").dataset.cat);
      toSvc = parseInt(target.querySelector("[data-svc]").dataset.svc);
      if (!insertBefore) toSvc++;
      if (toCat === fromCat && fromSvc < toSvc) toSvc--;
    }
    if (fromCat !== toCat || fromSvc !== toSvc) {
      const [svc] = p.categories[fromCat].services.splice(fromSvc, 1);
      p.categories[toCat].services.splice(toSvc, 0, svc);
      saveConfig();
      render();
    }
  }
});

let resizeTimer=null;
let lastRenderWidth=window.innerWidth;
window.addEventListener("resize",()=>{
  // On mobile, the browser chrome (address bar) shrinks/grows during scroll,
  // triggering spurious resize events that only change height — ignore those.
  const w=window.innerWidth;
  if(w===lastRenderWidth)return;
  lastRenderWidth=w;
  clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>render(),150);
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.action==="recolor-tag"){page().tags[el.dataset.tag]=el.value;saveConfig();const pill=el.closest("div");if(pill)pill.style.borderColor=el.value;}
  // Widget field change (for datetime-local, number etc)
  if(el.dataset.action==="edit-widget-field"){
    const ci=parseInt(el.dataset.cat),si=parseInt(el.dataset.svc),f=el.dataset.field;
    const svc=page().categories[ci].services[si];
    if(f==="iframeHeight")svc[f]=parseInt(el.value)||200;else svc[f]=el.value;
    saveConfig();
  }
  // Image widget upload
  if(el.dataset.action==="upload-widget-image"){
    const file=el.files[0];if(!file)return;
    const ci=parseInt(el.dataset.cat),si=parseInt(el.dataset.svc);
    const svc=page().categories[ci]?.services[si];if(!svc)return;
    compressImage(file,1920,0.82).then(async(dataUrl)=>{
      try{
        const name="img_"+svc.id+".webp";
        const res=await fetch("/api/wallpaper",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,data:dataUrl})});
        const data=await res.json();
        if(data.url){svc.imageUrl=data.url+"?t="+Date.now();saveConfig();render();}
      }catch(e){console.error("Image upload failed",e);}
      el.value="";
    }).catch(e=>{console.error("Compress failed",e);el.value="";});
  }
  // Wallpaper upload
  if(el.dataset.action==="upload-wallpaper"){
    const file=el.files[0];if(!file)return;
    const wp=el.dataset.wp;
    const input=el;
    console.log("Wallpaper upload started:",file.name,Math.round(file.size/1024)+"KB");
    compressImage(file,1920,2160,0.82).then(async({dataUrl,isPortrait})=>{
      console.log("Compressed, uploading to server...");
      try{
        const res=await fetch("/api/wallpaper",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:wp+"_"+page().id+".webp",data:dataUrl})});
        const data=await res.json();
        console.log("Server response:",data);
        if(data.url){
          page().wallpaperDesktop=data.url+"?t="+Date.now();
          page().wallpaperFit=isPortrait?"contain":"cover";
          saveConfig();render();
        }
      }catch(e){console.error("Upload failed",e);}
      input.value="";
    }).catch(e=>{console.error("Compress failed",e);input.value="";});
  }
  // JSON file upload
  if(el.dataset.action==="json-upload"){
    const file=el.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=()=>{const ta=$("#json-text");if(ta)ta.value=reader.result;};
    reader.readAsText(file);
  }
});
// Close weather dropdown when clicking outside or scrolling
document.addEventListener("click",e=>{if(!e.target.closest(".weather-city-search")&&!e.target.closest(".weather-city-results")){document.querySelectorAll(".weather-city-results").forEach(d=>d.style.display="none");}},true);
document.addEventListener("scroll",()=>{document.querySelectorAll(".weather-city-results").forEach(d=>d.style.display="none");},true);

document.addEventListener("blur",e=>{const el=e.target;
  if(el.dataset.action==="edit-srv-url"&&el.value.trim()){const prefixed=autoPrefix(el.value);if(prefixed!==el.value){el.value=prefixed;const ci=parseInt(el.dataset.cat),si=parseInt(el.dataset.svc),sri=parseInt(el.dataset.srv);page().categories[ci].services[si].servers[sri].url=prefixed;saveConfig();}}
  // Auto-fill service icon from name
  if(el.dataset.action==="edit-svc-name"&&el.value.trim()){
    const ci=parseInt(el.dataset.cat),si=parseInt(el.dataset.svc);
    const svc=page().categories[ci]?.services[si];
    if(svc&&!svc.icon){const name=el.value.toLowerCase().replace(/[^a-z0-9]/g,"");
      fetch("/api/icons/"+encodeURIComponent(name)+"/url").then(r=>r.json()).then(d=>{if(d.url){svc.icon=d.url;saveConfig();render();reopenSvc(ci,si);}}).catch(()=>{});}
  }
  // Auto-fill bookmark icon from label
  if(el.dataset.action==="edit-bm-label"&&el.value.trim()){
    const ci=parseInt(el.dataset.cat),si=parseInt(el.dataset.svc),li=parseInt(el.dataset.li);
    const lk=page().categories[ci]?.services[si]?.links[li];
    if(lk&&!lk.icon){const name=el.value.toLowerCase().replace(/[^a-z0-9]/g,"");
      fetch("/api/icons/"+encodeURIComponent(name)+"/url").then(r=>r.json()).then(d=>{if(d.url){lk.icon=d.url;saveConfig();render();reopenSvc(ci,si);}}).catch(()=>{});}
  }
},true);

loadConfig();
window.addEventListener("resize",()=>{if(page()&&page().wallpaperDesktop)applyWallpaper();});
</script>
