services:
  roampage:
    image: anagraphy/roampage:latest
    container_name: roampage
    restart: unless-stopped
    ports:
      - "3046:3000"
    # environment:
    #   ENCRYPTION_KEY: "none"  # or a 64-char hex key — see README
    volumes:
      - ./data:/data
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
