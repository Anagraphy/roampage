services:
  roampage:
    build: .
    container_name: roampage
    restart: unless-stopped
    ports:
      - "80:3000"
    # Optional: set a persistent 64-char hex encryption key to keep it out of the data volume
    # Generate with: openssl rand -hex 32
    # environment:
    #   ENCRYPTION_KEY: ""
    volumes:
      - ./data:/data

networks:
  newt:
    external: true
